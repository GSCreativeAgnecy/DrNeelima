{% extends "base.html" %}
{% block title %}Book Appointment | Dr. Neelima Talari{% endblock %}
{% block content %}
<section class="min-h-screen pt-28 pb-16 bg-gradient-to-br from-teal-50 via-white to-blue-50">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="text-center mb-10 reveal">
            <p class="text-teal-600 font-semibold text-sm tracking-widest uppercase mb-2">Book Online</p>
            <h1 class="font-heading text-3xl sm:text-4xl font-bold text-gray-900">Book an Appointment</h1>
            <div class="w-20 h-1 bg-gradient-to-r from-teal-400 to-teal-600 mx-auto mt-4 rounded-full"></div>
            <p class="text-gray-600 mt-3">Fill in your details and we'll confirm your appointment</p>
        </div>
        <div class="bg-white rounded-2xl shadow-xl p-6 sm:p-8 border border-gray-100 reveal">
            <form id="appointmentForm" class="space-y-5">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">Full Name <span class="text-red-500">*</span></label>
                        <input type="text" name="full_name" required
                               class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition-all outline-none" placeholder="Enter your full name">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">Age <span class="text-red-500">*</span></label>
                        <input type="number" name="age" min="1" max="150" required
                               class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition-all outline-none" placeholder="Your age">
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">Phone Number <span class="text-red-500">*</span></label>
                        <input type="tel" name="phone" required pattern="[0-9]{10,}"
                               class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition-all outline-none" placeholder="10-digit mobile number">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">Email <span class="text-red-500">*</span></label>
                        <input type="email" name="email" required
                               class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition-all outline-none" placeholder="your@email.com">
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">Appointment Date <span class="text-red-500">*</span></label>
                        <input type="date" name="appointment_date" required
                               class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition-all outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">Preferred Time <span class="text-red-500">*</span></label>
                        <input type="time" name="preferred_time" required
                               class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition-all outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Reason for Visit <span class="text-red-500">*</span></label>
                    <textarea name="reason" rows="3" required
                              class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition-all outline-none" placeholder="Briefly describe your concern..."></textarea>
                </div>
                <button type="submit"
                        class="w-full px-6 py-3 bg-gradient-to-r from-teal-500 to-teal-600 text-white font-semibold rounded-xl hover:from-teal-600 hover:to-teal-700 transition-all duration-300 shadow-md hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed"
                        id="submitBtn">
                    <i class="fas fa-paper-plane mr-2"></i>Book Appointment
                </button>
                <div id="formMessage" class="hidden p-4 rounded-lg text-sm font-medium"></div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
