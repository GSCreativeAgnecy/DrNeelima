services:
  dr-neelima:
    build: .
    container_name: dr-neelima
    expose:
      - "8000"
    volumes:
      - ./appointments.db:/app/appointments.db
    environment:
      - APP_NAME=Dr. Neelima Talari
      - DEBUG=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
